name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:eslint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # App y tests por separado: menos pico de RAM (runner ≈ 7 GB).
      - name: Typecheck app
        run: npm run typecheck:app
        env:
          NODE_OPTIONS: --max-old-space-size=5632
      - name: Typecheck tests
        run: npm run typecheck:tests
        env:
          NODE_OPTIONS: --max-old-space-size=3072

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/controlmaster_test?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB (replica set para transacciones)
        run: |
          docker run -d --name mongo-ci -p 27017:27017 mongo:7 \
            mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo-ci mongosh --quiet --eval "db.adminCommand('ping').ok" && break
            sleep 1
          done
          docker exec mongo-ci mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})' || true
          sleep 5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Stop MongoDB
        if: always()
        run: docker rm -f mongo-ci

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit:ci

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: [eslint, typecheck, test, audit]
    env:
      SKIP_TYPECHECK: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
